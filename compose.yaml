services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    volumes:
      # Both SQLite and funding snapshots must survive container replacement.
      - ./data:/app/data
    restart: unless-stopped
